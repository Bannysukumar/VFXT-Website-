<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="theme-color" content="#0A1F1A" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Virtual FX Trades (VFXT) — secure digital trading, wallets, and token platform."
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap"
      rel="stylesheet"
      media="print"
      onload="this.media='all'"
    />
    <noscript>
      <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap"
        rel="stylesheet"
      />
    </noscript>
    <title>VFXT — Virtual FX Trades</title>
    <style>
      html,
      body {
        margin: 0;
        min-height: 100%;
        background: #f7f9f8;
      }
      #boot-splash {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: grid;
        place-items: center;
        background: #f7f9f8;
        color: #142e28;
        font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
        transition: opacity 0.25s ease, visibility 0.25s ease;
      }
      #boot-splash.is-done {
        opacity: 0;
        visibility: hidden;
        pointer-events: none;
      }
      #boot-splash .boot-card {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 1rem;
        padding: 1.5rem;
      }
      #boot-splash .boot-mark {
        width: 3rem;
        height: 3rem;
        border-radius: 0.85rem;
        background: linear-gradient(145deg, #1a7a5c, #0f4f3d);
        color: #fff;
        display: grid;
        place-items: center;
        font-weight: 800;
        font-size: 1.15rem;
        letter-spacing: -0.03em;
        box-shadow: 0 10px 30px rgba(15, 79, 61, 0.25);
      }
      #boot-splash .boot-title {
        margin: 0;
        font-size: 1.05rem;
        font-weight: 700;
        letter-spacing: -0.02em;
      }
      #boot-splash .boot-sub {
        margin: 0;
        font-size: 0.875rem;
        color: #5b736c;
      }
      #boot-splash .boot-spinner {
        width: 1.35rem;
        height: 1.35rem;
        border: 2.5px solid rgba(26, 122, 92, 0.2);
        border-top-color: #1a7a5c;
        border-radius: 50%;
        animation: boot-spin 0.7s linear infinite;
      }
      @keyframes boot-spin {
        to {
          transform: rotate(360deg);
        }
      }
    </style>
  </head>
  <body>
    <div id="boot-splash" role="status" aria-live="polite" aria-label="Loading VFXT">
      <div class="boot-card">
        <div class="boot-mark" aria-hidden="true">V</div>
        <p class="boot-title">VFXT</p>
        <p class="boot-sub">Loading secure trading platform…</p>
        <div class="boot-spinner" aria-hidden="true"></div>
      </div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
