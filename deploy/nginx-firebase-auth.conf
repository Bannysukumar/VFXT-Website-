# Firebase Auth same-origin helper for aaPanel / nginx.
# Include inside the virtualfxtrades.com server { } block, then reload nginx.
#
# After this is live, set in .env.local and rebuild:
#   VITE_FIREBASE_AUTH_DOMAIN=virtualfxtrades.com
#
# Keeps Auth iframe/handler on the same site so mobile Chrome does not block
# third-party storage against *.firebaseapp.com.

location /__/auth/ {
    proxy_pass https://vfxt-a60d6.firebaseapp.com/__/auth/;
    proxy_ssl_server_name on;
    proxy_set_header Host vfxt-a60d6.firebaseapp.com;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_http_version 1.1;
    proxy_buffering off;
}

location /__/firebase/ {
    proxy_pass https://vfxt-a60d6.firebaseapp.com/__/firebase/;
    proxy_ssl_server_name on;
    proxy_set_header Host vfxt-a60d6.firebaseapp.com;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_http_version 1.1;
}
