# Security headers for virtualfxtrades.com (aaPanel / nginx).
# Include inside the site's server { } block (or "HTTP header" / custom config),
# then: nginx -t && nginx -s reload
#
# These apply even when nginx serves /dist statically (bypassing Node serve-spa).

add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' https://www.gstatic.com https://www.google.com https://apis.google.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: blob: https:; connect-src 'self' https://*.googleapis.com https://*.firebaseio.com https://*.cloudfunctions.net wss://*.firebaseio.com https://identitytoolkit.googleapis.com https://securetoken.googleapis.com https://*.walletconnect.com wss://*.walletconnect.com; frame-src https://www.google.com https://*.firebaseapp.com https://verify.walletconnect.com https://verify.walletconnect.org; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;

# Optional: do not index error pages as soft 200s
# add_header X-Robots-Tag "noindex" always;
